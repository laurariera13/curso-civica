models:
  - name: slv_google_sheets__budget
    columns:
      - name: budget_id
        data_tests: [unique, not_null]
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_sql_server_dbo__products')
                field: product_id
      - name: QUANTITY_BUDGETED
        tests:
          - positive_values
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: false
      - name: BUDGET_MONTH
      - name: DATE_LOAD

